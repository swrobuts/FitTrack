# Lokaler Start mit einem Befehl:
#   docker compose up --build        # Image bauen und Container starten
#   docker compose down              # Container stoppen und entfernen
#
# Port 8000 ist auf manchen Rechnern belegt. Dann so starten:
#   FITTRACK_PORT=8001 docker compose up --build
services:
  fittrack:
    build: .                          # nutzt das Dockerfile in diesem Ordner
    image: fittrack
    ports:
      - "${FITTRACK_PORT:-8000}:8000" # links der Port auf dem Rechner, rechts im Container
    environment:
      # Trainingsbot: LM Studio läuft auf dem Rechner, nicht im Container. host.docker.internal
      # ist aus dem Container der Name des Rechners; ohne laufendes LM Studio bleibt der Bot aus.
      - LMSTUDIO_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"   # nötig unter Linux, auf Mac und Windows ohne Wirkung
    restart: unless-stopped
