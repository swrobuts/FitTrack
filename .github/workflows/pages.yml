# GitHub Pages: veröffentlicht den Ordner site/ als statische Website.
# Ergebnis: https://swrobuts.github.io/FitTrack/
# Die App selbst läuft nicht hier, sondern bei Render (siehe render.yaml):
# Pages liefert Dateien aus, FastAPI braucht einen Server.
name: Lernumgebung veröffentlichen

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Ordner site/ hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
